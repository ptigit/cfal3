<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CFA L3 Sprints</title>
<style>
:root{
  --bg:#0e1014; --surface:#181b22; --surface-2:#20242d; --line:#2b303b;
  --ink:#eef1f6; --dim:#8f97a8; --faint:#5d6474;
  --accent:#6b8afd; --accent-2:#9c7bfa;
  --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column;
  min-height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:0 16px;flex:1;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;gap:10px}
.topbar h1{font-size:.95rem;margin:0;font-weight:650;letter-spacing:.2px}
.topbar .sub{font-size:.7rem;color:var(--faint);margin-top:2px}
.icon-btn{background:var(--surface);border:1px solid var(--line);color:var(--dim);
  border-radius:10px;padding:7px 11px;font-size:.75rem;font-weight:600;cursor:pointer}

/* ---------- home ---------- */
.hero{background:linear-gradient(150deg,#1d2331,#151820);border:1px solid var(--line);
  border-radius:20px;padding:20px;margin-top:6px}
.hero .eyebrow{font-size:.66rem;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);font-weight:700}
.hero h2{margin:8px 0 4px;font-size:1.22rem}
.hero p{margin:0;color:var(--dim);font-size:.83rem;line-height:1.45}
.big-btn{width:100%;margin-top:16px;border:none;border-radius:14px;padding:15px;
  font-size:.95rem;font-weight:700;color:#0b0d11;cursor:pointer;
  background:linear-gradient(120deg,var(--accent),var(--accent-2))}
.big-btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  font-weight:600;font-size:.86rem;padding:13px;margin-top:9px}

.stat-row{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:11px 6px;text-align:center}
.stat b{display:block;font-size:1.15rem;line-height:1.2}
.stat span{font-size:.63rem;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.tot b{color:var(--accent)}

.section-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.8px;
  color:var(--faint);font-weight:700;margin:22px 0 9px}

/* topic strength list */
.topic{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:11px 13px;margin-bottom:7px;cursor:pointer}
.topic-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.topic-name{font-size:.82rem;font-weight:600}
.topic-pct{font-size:.72rem;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:4px;background:#262b35;border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ok),#2fae7c)}
.bar.weak i{background:linear-gradient(90deg,var(--bad),var(--warn))}
.bar.mid i{background:linear-gradient(90deg,var(--warn),#ffd08a)}

/* ---------- sprint ---------- */
.sprint-head{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.dots{display:flex;gap:5px;flex:1}
.dot{height:4px;flex:1;border-radius:3px;background:#262b35}
.dot.done{background:var(--accent)}
.dot.active{background:var(--accent-2)}
.close-x{background:none;border:none;color:var(--faint);font-size:1.25rem;cursor:pointer;padding:0 2px;line-height:1}

.cat-tag{font-size:.65rem;text-transform:uppercase;letter-spacing:.6px;
  color:var(--accent);font-weight:700;margin-bottom:11px}

.card-area{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:4px 0 12px;min-height:0}
.panel{background:linear-gradient(155deg,#1b1f28,#14171d);border:1px solid var(--line);
  border-radius:20px;padding:20px;box-shadow:0 12px 34px rgba(0,0,0,.4)}
.prompt{font-size:1.05rem;line-height:1.48;margin:0 0 4px;font-weight:500}
.prompt.small{font-size:.98rem}

/* list-builder */
.slot{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid #23272f}
.slot:first-of-type{border-top:none}
.slot-num{flex:0 0 20px;height:20px;border-radius:6px;background:#262b35;color:var(--faint);
  font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.slot.open .slot-num{background:rgba(107,138,253,.18);color:var(--accent)}
.slot-text{flex:1;font-size:.9rem;line-height:1.45;color:var(--ink)}
.slot-text.hidden{color:var(--faint);font-style:italic;font-size:.83rem}
.list-meta{font-size:.72rem;color:var(--faint);margin:12px 0 2px;text-align:center}

/* contrast */
.col{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px;
  background:rgba(255,255,255,.015);cursor:pointer}
.col-label{font-size:.78rem;font-weight:700;color:var(--accent-2);margin-bottom:2px}
.col-tap{font-size:.72rem;color:var(--faint)}
.col ul{margin:8px 0 0;padding-left:17px}
.col li{font-size:.86rem;line-height:1.45;margin-bottom:5px}

/* qa reveal */
.answer{margin-top:14px;padding-top:14px;border-top:1px solid #23272f;
  font-size:.93rem;line-height:1.5;color:var(--ink)}
.tap-hint{text-align:center;color:var(--faint);font-size:.73rem;margin-top:14px}

.grade-row{display:flex;gap:9px;margin-top:14px}
.grade{flex:1;border:none;border-radius:14px;padding:14px 8px;font-size:.86rem;
  font-weight:700;cursor:pointer;color:#0b0d11}
.grade.miss{background:linear-gradient(120deg,#ff8a5c,var(--bad))}
.grade.got{background:linear-gradient(120deg,var(--ok),#1fb37a)}
.reveal-btn{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:14px;padding:14px;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:14px}

/* ---------- done ---------- */
.done-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px 0}
.done-mark{font-size:2.6rem}
.done-wrap h2{margin:10px 0 6px;font-size:1.3rem}
.done-wrap p{color:var(--dim);font-size:.87rem;margin:0;line-height:1.5}
.recap{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px;margin-top:18px;text-align:left}
.recap-item{font-size:.78rem;color:var(--dim);padding:6px 0;border-top:1px solid #23272f;line-height:1.4}
.recap-item:first-child{border-top:none}
.recap-item b{color:var(--ink);font-weight:600}

.muted-note{font-size:.72rem;color:var(--faint);text-align:center;margin-top:16px;line-height:1.5}
.hidden-el{display:none}

/* mode switcher */
.modebar{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:4px;margin-top:4px}
.mode{flex:1;background:none;border:none;color:var(--dim);border-radius:10px;
  padding:9px 4px;font-size:.78rem;font-weight:600;cursor:pointer}
.mode.on{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* formula display */
.f-ask{font-size:.66rem;text-transform:uppercase;letter-spacing:.7px;
  color:var(--accent-2);font-weight:700;margin-bottom:6px}
.f-box{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.9rem;line-height:1.65;
  background:rgba(107,138,253,.08);
  border:1px solid rgba(107,138,253,.22);
  border-radius:12px;padding:13px 14px;margin-top:12px;
  white-space:pre-wrap;overflow-x:auto;color:#dce4ff;
}

/* reference view */
.search{width:100%;padding:12px 13px;border-radius:13px;background:var(--surface);
  color:var(--ink);border:1px solid var(--line);font-size:.9rem;margin-top:4px}
.search::placeholder{color:var(--faint)}
.ref-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:13px;margin-bottom:8px}
.ref-name{font-size:.85rem;font-weight:650;color:var(--ink)}
.ref-card .f-box{margin-top:9px;font-size:.85rem}
.ref-d{font-size:.79rem;line-height:1.5;color:var(--dim);margin-top:9px}
</style>
</head>
<body>
<div class="wrap" id="app"><div style="padding:40px;text-align:center;color:#5d6474;font-size:.85rem">Loading…</div></div>

<script>
/* ============================================================
   CARD BANK — drawn from the uploaded revision summaries
   types: qa | list | contrast
   ============================================================ */
const CARDS = [

/* ---------- AA · CME Framework & Macro ---------- */
{t:"list",c:"AA · CME Framework & Macro",q:"The 7 steps of the capital market expectations-setting process.",
 items:["Specify the set of expectations needed, incl. time horizons","Research the historical record","Specify the methods/models and their information requirements","Determine the best sources for information needs","Interpret the current investment environment using judgment","Provide the expectations and document conclusions","Monitor outcomes, compare to forecasts, feed back"]},
{t:"list",c:"AA · CME Framework & Macro",q:"Challenges in setting capital market expectations.",
 items:["Limitations of economic data (timeliness, changing definitions)","Data measurement errors and biases (survivorship, appraisal smoothing)","Limitations of historical estimates (nonstationarity, fat tails)","Ex post risk as a biased risk measure","Bias in methods (data-mining, time-period bias)","Failure to account for conditioning information","Misinterpretation of correlations","Psychological biases (anchoring, confirmation, overconfidence…)","Model uncertainty"]},
{t:"list",c:"AA · CME Framework & Macro",q:"The most important sources of exogenous shocks to growth trends.",
 items:["Policy changes","New products and technologies","Geopolitics","Natural disasters","Natural resources / critical inputs","Financial crises"]},
{t:"contrast",c:"AA · CME Framework & Macro",q:"Cross-sectional vs intertemporal consistency in CME setting.",
 left:{label:"Cross-sectional",points:["Consistency across asset classes at a point in time","Ensures relative pricing between classes hangs together"]},
 right:{label:"Intertemporal",points:["Consistency across various time horizons","Short- and long-horizon forecasts must cohere"]},
 note:"Both matter far more than the accuracy of any single asset class projection."},
{t:"list",c:"AA · CME Framework & Macro",q:"The three main approaches to economic forecasting.",
 items:["Econometric models — disciplined and quantitative, but complex, mis-specification risk, poor at turning points","Indicators (lead/lag/coincident) — simplest, few statistics needed, but false signals and revision/overfitting risk","Checklists — most flexible and adaptive, but most subjective, time-consuming, limits depth and consistency"]},
{t:"list",c:"AA · CME Framework & Macro",q:"The five business cycle phases and their capital market implications.",
 items:["Initial Recovery — short rates & yields low, yields bottoming; stocks may rise strongly; cyclical/risky assets outperform","Early Expansion — short rates moving up; long yields stable/slightly rising; stocks trending up","Late Expansion — rates rise, curve flattens; stocks often rise but volatile; inflation hedges outperform cyclicals","Slowdown — short rates at/near peak; govt yields peak then fall sharply; curve may invert; spreads widen; quality/interest-sensitive stocks best","Contraction — rates and yields drop; curve steepens; stocks fall then rise before recovery; spreads stay wide until trough is clear"]},
{t:"qa",c:"AA · CME Framework & Macro",q:"What is the Taylor Rule used for in setting capital market expectations?",
 a:"Assessing a central bank's current policy stance and predicting how that stance is likely to evolve."},
{t:"contrast",c:"AA · CME Framework & Macro",q:"Effect of persistently loose fiscal vs loose monetary policy.",
 left:{label:"Loose fiscal policy",points:["Raises the average level of real interest rates","Tight fiscal policy reduces them"]},
 right:{label:"Loose monetary policy",points:["Raises average actual and expected inflation","Tight monetary policy reduces them"]},
 note:"If one is persistently loose and the other tight, the impact on nominal rates is ambiguous."},
{t:"qa",c:"AA · CME Framework & Macro",q:"Under what condition will two countries share a default-free yield curve?",
 a:"Only if there is perfect capital mobility AND the exchange rate is credibly fixed forever. It is the lack of credibly fixed rates that lets yield curves — and bond returns — be imperfectly correlated across markets."},
{t:"qa",c:"AA · CME Framework & Macro",q:"With floating rates, how must interest rates differ to equalise risk-adjusted expected returns across markets?",
 a:"Rates must be higher in a currency expected to depreciate and lower in one expected to appreciate. This can cause the exchange rate to overshoot in one direction to generate the expectation of movement in the other."},
{t:"list",c:"AA · CME Framework & Macro",q:"The four mechanisms keeping the current and capital accounts in balance.",
 items:["Changes in income (GDP)","Relative prices","Interest rates and asset prices","Exchange rates"]},

/* ---------- AA · Forecasting Returns ---------- */
{t:"list",c:"AA · Forecasting Returns",q:"The three broad categories of formal return-forecasting tools.",
 items:["Statistical methods (sample stats, shrinkage, time-series)","Discounted cash flow models","Risk premium models (equilibrium e.g. CAPM, factor models, building blocks)"]},
{t:"list",c:"AA · Forecasting Returns",q:"The four building blocks of fixed-income expected returns.",
 items:["Short-term default-free rate","Term premium — roughly proportional to duration","Credit premium — tends to be larger at the short end of the curve","Liquidity premium"],
 note:"Both term and credit premiums are positively related to the slope of the yield curve."},
{t:"list",c:"AA · Forecasting Returns",q:"The three components of the Grinold–Kroner model of expected equity return.",
 items:["Expected cash flow return = dividend yield − rate of change in shares outstanding","Expected return from nominal earnings growth","Expected repricing return = rate of change in the P/E"]},
{t:"qa",c:"AA · Forecasting Returns",q:"What does the Singer–Terhaar model combine?",
 a:"A global CAPM equilibrium assuming full market integration, blended with expected returns for each asset class based on complete segmentation."},
{t:"qa",c:"AA · Forecasting Returns",q:"Define the cap rate and give the real-estate analogue of Grinold–Kroner.",
 a:"Cap rate = net operating income ÷ property value — the standard commercial real estate valuation metric. E(R_re) = cap rate + NOI growth rate − %Δcap rate."},
{t:"list",c:"AA · Forecasting Returns",q:"The building-block risk premiums embedded in real estate expected returns.",
 items:["Term premium — long-lived asset with stable cash flows, so high duration","Credit premium — a fixed-term lease resembles a corporate bond secured by the property","Equity premium — owners bear value, rent growth, renewal and vacancy risk","Liquidity premium — trades infrequently and is costly to transact"]},
{t:"qa",c:"AA · Forecasting Returns",q:"Why is historical real estate return data problematic?",
 a:"It is subject to substantial appraisal smoothing, which biases volatility estimates downward and distorts correlations. Failing to adjust for it almost certainly leads to distorted portfolio analysis and poor allocation decisions."},
{t:"qa",c:"AA · Forecasting Returns",q:"Over what horizon is PPP a useful predictor of exchange rates?",
 a:"A poor predictor over short-to-intermediate horizons, but a progressively better guide over longer multi-year horizons."},
{t:"list",c:"AA · Forecasting Returns",q:"The two main problems with using the sample VCV matrix as a forecast.",
 items:["It cannot be used for large numbers of asset classes","It is subject to substantial sampling error"],
 note:"Linear factor models fix the dimensionality problem but are biased/inconsistent unless the assumed structure is true. Shrinkage blends sample and target VCV."},
{t:"qa",c:"AA · Forecasting Returns",q:"What behaviour in asset returns did ARCH models address?",
 a:"Volatility clustering — periods of persistently high and low volatility. A simple ARCH model represents today's variance as a linear combination of yesterday's variance and a new volatility shock."},

/* ---------- AA · Overview & Principles ---------- */
{t:"contrast",c:"AA · Overview & Principles",q:"Asset-only vs liability-relative vs goals-based approaches (risk focus).",
 left:{label:"Asset-only",points:["Focuses on the asset side of the economic balance sheet","Risk concept: asset risk (e.g. volatility of returns)"]},
 right:{label:"Liability-relative / Goals-based",points:["Liability-relative: focuses on funding liabilities; risk = risk relative to paying them","Goals-based: focuses on achieving financial goals; risk = probability of not achieving each goal"]}},
{t:"list",c:"AA · Overview & Principles",q:"Criteria for specifying a good set of asset classes.",
 items:["Assets within a class should be relatively homogeneous","Classes should be mutually exclusive","Classes should be diversifying","As a group they should make up a preponderance of world investable wealth","Each should be able to absorb a meaningful proportion of the portfolio"]},
{t:"contrast",c:"AA · Overview & Principles",q:"Calendar-based vs range-based rebalancing.",
 left:{label:"Calendar-based",points:["Rebalances to target weights on a fixed periodic schedule","Simple; but asset mix can drift far between dates"]},
 right:{label:"Range-based",points:["Sets thresholds/trigger points around target weights","Ranges may be fixed-width, percentage-based, or volatility-based","Permits tighter control of the asset mix"]}},
{t:"list",c:"AA · Overview & Principles",q:"The criticisms of mean–variance optimisation (MVO).",
 items:["Outputs are highly sensitive to small changes in inputs","Allocations are highly concentrated in a subset of classes","Ignores skewness and kurtosis that investors care about","Assets may look diversified while sources of risk are not","No direct connection to factors driving liabilities or consumption","Single-period framework — ignores rebalancing costs and taxes"]},
{t:"qa",c:"AA · Overview & Principles",q:"What is the Black–Litterman model, and what problem does it address?",
 a:"Deriving expected returns by reverse optimisation tilted toward the investor's own views. It addresses MVO's tendency to produce 'efficient' portfolios that are not well diversified. Weight constraints and resampling address the same concern."},
{t:"qa",c:"AA · Overview & Principles",q:"When is a risk budget optimal?",
 a:"When the ratio of excess return to marginal contribution to total risk is the same for all assets in the portfolio."},
{t:"list",c:"AA · Overview & Principles",q:"The three approaches to liability-relative asset allocation.",
 items:["Surplus optimisation — MVO applied to surplus returns","Hedging / return-seeking portfolios — one portfolio hedges the liability stream, remaining funds seek return","Integrated asset–liability approach — jointly optimises asset and liability decisions"]},
{t:"list",c:"AA · Overview & Principles",q:"Characteristics of liabilities that affect liability-relative asset allocation.",
 items:["Fixed versus contingent cash flows","Legal versus quasi-liabilities","Duration and convexity of liability cash flows","Value of liabilities vs size of the sponsoring organisation","Factors driving future cash flows (inflation, economy, rates, risk premium)","Timing considerations such as longevity risk","Regulations affecting liability cash flow calculations"]},
{t:"list",c:"AA · Overview & Principles",q:"Interpretations of why disciplined rebalancing adds return.",
 items:["It earns a diversification return","It earns a return from being short volatility","It earns a return for supplying liquidity to the market"]},
{t:"qa",c:"AA · Overview & Principles",q:"Which factors widen the optimal rebalancing corridor, and which narrow it?",
 a:"Widen: transaction costs, risk tolerance, and correlation with the rest of the portfolio (higher correlation → wider, since further divergence is less likely). Narrow: volatility of the rest of the portfolio (inversely related). Own volatility trades transaction costs off against risk control."},

/* ---------- AA · Real-World Constraints ---------- */
{t:"list",c:"AA · Real-World Constraints",q:"The primary constraints on an asset allocation decision.",
 items:["Asset size — too small or too large to access certain classes efficiently","Liquidity — needs of the owner and characteristics of the classes","Time horizon — human capital and changing character of liabilities","External considerations — taxes, regulation, funding and financing needs"]},
{t:"qa",c:"AA · Real-World Constraints",q:"How do taxes alter asset allocation inputs?",
 a:"Taxes reduce the expected mean return and mute the dispersion of returns, so return and standard deviation assumptions must be adjusted per asset class. Correlation assumptions do not need adjusting. Rebalancing thresholds may be wider for taxable portfolios."},
{t:"qa",c:"AA · Real-World Constraints",q:"What is strategic asset location (not allocation)?",
 a:"The placement of less tax-efficient assets in accounts with more favourable tax treatment."},
{t:"list",c:"AA · Real-World Constraints",q:"Ways the success of tactical asset allocation (TAA) is measured against the SAA.",
 items:["Comparing Sharpe ratios of the TAA vs SAA portfolio","Evaluating the information ratio or t-statistic of average excess return","Plotting outcomes versus the efficient frontier"]},
{t:"contrast",c:"AA · Real-World Constraints",q:"Discretionary vs systematic TAA.",
 left:{label:"Discretionary TAA",points:["Qualitative interpretation of political, economic and market conditions","Predicated on belief in persistent manager skill at short-term timing"]},
 right:{label:"Systematic TAA",points:["Relies on quantitative signals","Captures documented return anomalies inconsistent with market efficiency"]}},
{t:"list",c:"AA · Real-World Constraints",q:"The behavioural biases most relevant in asset allocation.",
 items:["Loss aversion — mitigate via shortfall framing or funding key goals with low-risk assets","Illusion of control — mitigate via a formal process with long-term forecasts and policy ranges","Mental accounting — goals-based investing incorporates it directly via sub-portfolios","Recency bias — constrained by pre-specified allowable ranges","Framing — mitigate by presenting choices with multiple risk/reward perspectives","Availability / familiarity bias — mitigate by anchoring on the global market portfolio"]},

/* ---------- PC · Equity ---------- */
{t:"list",c:"PC · Equity Portfolio Mgmt",q:"The roles equities can play in a portfolio.",
 items:["Capital appreciation","Dividend income","Diversification with other asset classes","Potential hedge against inflation"]},
{t:"list",c:"PC · Equity Portfolio Mgmt",q:"Sources of equity portfolio income and of equity portfolio costs.",
 items:["Income: dividends, securities lending fees and interest, dividend capture, covered calls, cash-covered puts","Costs: management fees, performance fees, administration fees, marketing/distribution fees, trading costs"]},
{t:"qa",c:"PC · Equity Portfolio Mgmt",q:"What must an equity benchmark index be, and what characteristics matter?",
 a:"It must be rule-based, transparent, and investable. Key characteristics: market covered (domestic/foreign), market cap of constituents, position on the value–growth spectrum, and other risk factors."},
{t:"contrast",c:"PC · Equity Portfolio Mgmt",q:"Index rebalancing vs reconstitution.",
 left:{label:"Rebalancing",points:["Adjusts constituent weights after price changes, mergers, corporate events","Corrects drift from the intended weighting scheme"]},
 right:{label:"Reconstitution",points:["Deletes names no longer qualifying for the index","Adds names approved as new index members"]}},
{t:"list",c:"PC · Equity Portfolio Mgmt",q:"Disadvantages of shareholder engagement.",
 items:["Costs and time involved","Pressure on the company to meet near-term price or earnings targets","Possible selective disclosure of information","Potential conflicts of interest"]},

/* ---------- PC · Fixed Income ---------- */
{t:"contrast",c:"PC · Fixed-Income Portfolio Mgmt",q:"Cash flow matching vs duration matching for liability-based mandates.",
 left:{label:"Cash flow matching",points:["Buys high-quality zeros/fixed bonds matching amount and timing of liabilities","Can achieve accounting defeasance — both sides leave the balance sheet"]},
 right:{label:"Duration matching",points:["Matches interest rate sensitivity rather than individual cash flows","Requires ongoing rebalancing as yields and durations change"]}},
{t:"qa",c:"PC · Fixed-Income Portfolio Mgmt",q:"What does spread duration measure, and why is 'duration times spread' preferred?",
 a:"Spread duration gives the approximate % price increase (decrease) for a 1% decrease (increase) in credit spread. Duration times spread modifies it because spread changes across the credit spectrum tend to occur on a proportional percentage basis rather than in absolute basis points."},
{t:"contrast",c:"PC · Fixed-Income Portfolio Mgmt",q:"Type I vs Type II–IV assets and liabilities.",
 left:{label:"Type I",points:["Known cash flow amounts and payment dates (e.g. option-free fixed-rate bonds)","Use yield duration statistics: Macaulay, modified, money duration"]},
 right:{label:"Type II, III, IV",points:["Uncertain amounts and/or uncertain timing","Use curve duration statistics such as effective duration","A model values the portfolio under equal up and down curve shifts"]}},
{t:"list",c:"PC · Fixed-Income Portfolio Mgmt",q:"The components of expected fixed-income return.",
 items:["Coupon income","Rolldown return","Expected price change from the investor's views on yields-to-maturity and spreads","Expected currency gains or losses"]},
{t:"list",c:"PC · Fixed-Income Portfolio Mgmt",q:"Methods for leveraging a fixed-income portfolio.",
 items:["Futures contracts","Swap agreements","Repurchase agreements","Structured financial instruments","Securities lending"]},
{t:"list",c:"PC · Fixed-Income Portfolio Mgmt",q:"Advantages of a laddered bond portfolio.",
 items:["Diversification over the yield curve versus bullet or barbell portfolios","Greater cash flow dispersion, hence increased convexity","Liquidity — always contains a soon-to-mature bond usable as high-quality, low-duration repo collateral"]},
{t:"qa",c:"PC · Fixed-Income Portfolio Mgmt",q:"What is a total return swap and what are its advantages and drawbacks versus a bond fund?",
 a:"An OTC derivative transforming an asset or liability from one category to another (e.g. floating MRR cash flows into a bond index total return). Advantages: less initial cash outlay for similar performance, and access to hard-to-reach assets like high-yield and commercial loans. Drawback: counterparty credit risk."},

/* ---------- PC · Alternatives ---------- */
{t:"list",c:"PC · Alternative Investments",q:"The four roles alternatives typically fulfil in a portfolio.",
 items:["Capital growth","Income generation","Risk diversification","Safety"]},
{t:"list",c:"PC · Alternative Investments",q:"Typical risk factors applied to alternative investments.",
 items:["Equity","Size","Value","Liquidity","Duration","Inflation","Credit spread","Currency"],
 note:"Benefit: every asset class can be described in one framework. Limits: too many factors is unmanageable, too few is inaccurate, and sensitivities are highly dependent on the look-back period."},
{t:"qa",c:"PC · Alternative Investments",q:"What investment horizon guideline applies to private real estate, private real assets and private equity?",
 a:"Investors with less than a 15-year investment horizon should generally avoid these funds."},
{t:"qa",c:"PC · Alternative Investments",q:"Why are IRRs problematic for comparing private fund managers?",

{t:"qa",c:"PC · Trading Costs & E-Markets",q:"Define the effective spread, and when is it a poor cost estimate?",

{t:"qa",c:"PC · Trading Costs & E-Markets",q:"Why does VWAP tend to produce lower cost estimates than implementation shortfall?",
 a:"Because it compares average fill prices to average market prices over a window around the trade, and so often fails to measure the market impact of the order well."},

/* ---------- PM · Manager selection ---------- */
{t:"contrast",c:"PM · Investment Manager Selection",q:"Type I vs Type II error in manager selection.",
 left:{label:"Type I error",points:["Hiring or retaining a manager who subsequently underperforms","Rejecting the null hypothesis of no skill when it is correct"]},
 right:{label:"Type II error",points:["Not hiring, or firing, a manager who subsequently outperforms or meets expectations","Failing to reject the null hypothesis when it is incorrect"]}},
{t:"contrast",c:"PM · Investment Manager Selection",q:"Investment due diligence vs operational due diligence.",

{t:"contrast",c:"PM · Investment Manager Selection",q:"Returns-based (RBSA) vs holdings-based (HBSA) style analysis.",

 left:{label:"Management fee",points:["Lowers the level of realised return","Does not affect standard deviation"]},

/* ---------- PM · GIPS ---------- */
{t:"list",c:"PM · GIPS Standards",q:"The five objectives of the GIPS standards.",
 items:["Promote investor interests and instil investor confidence","Ensure accurate and consistent data","Obtain worldwide acceptance of a single standard for calculating and presenting performance","Promote fair, global competition among investment firms","Promote industry self-regulation on a global basis"]},
{t:"list",c:"PM · GIPS Standards",q:"Conditions allowing money-weighted returns instead of time-weighted returns.",
 items:["The firm must control the external cash flows into the portfolios/pooled fund","AND at least one of: closed-end","fixed life","fixed commitment","illiquid investments a significant part of the strategy"]},
{t:"list",c:"PM · GIPS Standards",q:"The GIPS fair value hierarchy, in order.",
 items:["Objective, observable, unadjusted quoted prices for identical investments in active markets","Quoted prices for similar investments in active markets","Quoted prices for identical or similar investments in markets that are not active","Market-based inputs other than quoted prices that are observable","Subjective, unobservable inputs"]},
{t:"list",c:"PM · GIPS Standards",q:"Key items required in a GIPS Composite Report presenting time-weighted returns.",
 items:["At least 5 years of annual performance, building to a minimum of 10 years","Composite and benchmark annual returns for all years","Number of portfolios (if six or more) at each period end","Amount of assets in the composite","Total firm assets at the end of each period","A measure of internal dispersion of individual portfolio returns","3-year annualised ex post standard deviation of composite and benchmark"]},
{t:"list",c:"PM · GIPS Standards",q:"Conditions for linking performance from a past firm or affiliation.",
 items:["Substantially all investment decision makers are employed by the new/acquiring firm","The decision-making process remains substantially intact and independent","The new firm has records documenting and supporting the reported performance","There is no break in the track record between the two firms"]},
{t:"qa",c:"PM · GIPS Standards",q:"Three quick GIPS calculation rules that are easy to trip on.",
 a:"Returns for periods of less than one year must not be annualised. Returns from cash and cash equivalents must be included in all total return calculations. Returns must be calculated after the deduction of transaction costs. Also: firms may not link simulated/model performance with actual performance, and a verification report may only be issued for the whole firm."},

/* ---------- DRV · Options ---------- */
{t:"contrast",c:"DRV · Options Strategies",q:"Synthetic long vs synthetic short forward positions.",
 left:{label:"Synthetic long",points:["Buy a call AND write a put","Same underlying, same strike, same expiration"]},
 right:{label:"Synthetic short",points:["Write a call AND buy a put","Same underlying, same strike, same expiration"]},
 note:"Synthetic long put = short stock + long call (call strike = short price). Synthetic long call = long stock + long put (put strike = purchase price)."},
{t:"list",c:"DRV · Options Strategies",q:"The four Greeks and what each measures.",
 items:["Delta — change in option price for a change in the underlying's price","Gamma — change in the option's delta for a change in the underlying's price","Vega — change in option price for a change in volatility of the underlying","Theta — the daily change in an option's price, all else equal"]},
{t:"contrast",c:"DRV · Options Strategies",q:"Covered call vs protective put.",
 left:{label:"Covered call",points:["Hold stock, write a call against it","Enhances yield or exits at a target price","Max return limited — right tail transferred to the buyer","Max loss lower than shares alone, but opportunity loss if shares rally hard"]},
 right:{label:"Protective put",points:["Hold stock, buy a put on the same asset","Insurance against a price decline","Max loss limited — downside transferred to the writer for a premium","Continuous purchase preserves upside but can be expensive"]}},
{t:"contrast",c:"DRV · Options Strategies",q:"Bull spread vs bear spread construction.",
 left:{label:"Bull spread",points:["Buy a call, write another call with a HIGHER exercise price","Same underlying and expiry","Bullish view"]},
 right:{label:"Bear spread",points:["Buy a put, write another put with a LOWER exercise price","Same underlying and expiry","Bearish view"]},
 note:"For both, maximum gain and maximum loss are known and limited."},
{t:"qa",c:"DRV · Options Strategies",q:"Describe a collar and the trade-off it makes.",
 a:"Long stock, plus write a call struck above the current price and buy a put struck below it. It limits the range of outcomes — sacrificing upside gain in exchange for downside protection."},
{t:"contrast",c:"DRV · Options Strategies",q:"Long straddle vs long calendar spread — what view does each express?",
 left:{label:"Long straddle",points:["Buy puts and calls, same exercise price and expiry","Expects increased volatility","Needs a large price move to profit"]},
 right:{label:"Long calendar spread",points:["Buy a long-dated option, write a shorter-dated option of the same type and strike","Outlook flat in the near term, greater movement expected later"]}},
{t:"contrast",c:"DRV · Options Strategies",q:"Volatility smile vs volatility skew.",
 left:{label:"Smile",points:["Implied volatilities of OTM options exceed those of ATM options","Roughly symmetric shape"]},
 right:{label:"Skew (more common)",points:["Implied volatility increases for OTM puts","Decreases for OTM calls as strike moves away from spot"]},
 note:"The implied volatility surface is a 3-D plot of expiry, strike and implied volatility — showing skew and the term structure of volatility at once."},

/* ---------- DRV · Swaps/futures ---------- */
{t:"qa",c:"DRV · Swaps, Forwards & Futures",q:"What is needed to hedge interest rate risk with bond futures?",
 a:"The basis point value (BPV) of the portfolio to be hedged, the target BPV, and the BPV of the futures — which itself derives from the BPV of the cheapest-to-deliver bond and its conversion factor. The number of contracts follows from the BPV hedge ratio."},
{t:"list",c:"DRV · Swaps, Forwards & Futures",q:"The three main types of equity swap.",
 items:["Receive equity return, pay fixed","Receive equity return, pay floating","Receive equity return, pay another equity return"],
 note:"A total return swap is a modified equity swap that also includes dividends paid by the underlying until swap maturity."},
{t:"qa",c:"DRV · Swaps, Forwards & Futures",q:"What is cash equitization?",
 a:"A strategy to boost returns by 'equitizing' unintended cash holdings, typically using stock index futures and interest rate futures."},
{t:"qa",c:"DRV · Swaps, Forwards & Futures",q:"How does a variance swap pay off, and what view does it express?",
 a:"The buyer receives the difference between realised annualised variance and the fixed variance strike, applied to a variance notional. It allows directional bets on implied versus realised volatility."},

/* ---------- DRV · Currency ---------- */
{t:"qa",c:"DRV · Currency Management",q:"What is an FX swap and what is it commonly used for?",
 a:"A simultaneous spot and forward transaction — one leg buys the base currency and the other sells it. Commonly used to renew maturing forward contracts, i.e. to roll them forward."},
{t:"list",c:"DRV · Currency Management",q:"The currency management spectrum, from passive to most active.",
 items:["Passive, rules-based, complete hedging of currency exposures","Discretionary hedging — some latitude for the manager","Active currency management — seeks out currency risk to manage it for profit","Currency overlay programmes — aggressively manage currency alpha"]},
{t:"list",c:"DRV · Currency Management",q:"Methods for forming market views on currencies.",
 items:["Macroeconomic fundamentals — estimate 'fair value', expecting spot to converge on it","Technical market indicators — historical price patterns, support/resistance, trend confirmation","Carry trade — sell low-yield, buy high-yield currencies, exploiting violations of uncovered interest rate parity","Volatility trading — uses options to express views on the distribution of future rates, not their level"]},
{t:"qa",c:"DRV · Currency Management",q:"Why do passive hedgers prefer forwards over futures, and what is the catch?",
 a:"Forwards are more flexible (futures suit smaller sizes and are common in private wealth management). The catch: forwards carry the possibility of negative roll yield, as embedded forward points can work for or against the hedge."},
{t:"qa",c:"DRV · Currency Management",q:"What is basis risk in a cross hedge?",
 a:"The risk that the correlation between the exposure and its cross-hedging instrument changes in unexpected ways. Forward contracts typically have very little basis risk relative to movements in the underlying spot rate."},

{t:"list",c:"PMP · Active Equity: Strategies",q:"The steps in the fundamental active investment process.",

{t:"contrast",c:"PMP · Active Equity: Strategies",q:"Pitfalls in fundamental vs quantitative investing.",

{t:"list",c:"PMP · Active Equity: Portfolio Construction",q:"The four building blocks of portfolio construction.",

{t:"contrast",c:"PMP · Active Equity: Portfolio Construction",q:"Active risk vs absolute risk.",

{t:"list",c:"PMP · Active Equity: Portfolio Construction",q:"What a well-constructed portfolio exhibits.",

/* ---------- PMP · LDI ---------- */
{t:"qa",c:"PMP · Liability-Driven & Index FI",q:"How is immunisation achieved for a single liability, and what is the risk?",
 a:"Match the Macaulay duration of the bond portfolio to the horizon date, rebalancing as yields and durations change (via bonds or interest rate derivatives). It aims to lock in the portfolio's cash flow yield — the IRR of the cash flows, not the weighted average YTM. The risk is that as the curve shifts and twists, the change in cash flow yield doesn't match that on the zero-coupon bond providing perfect immunisation."},
{t:"list",c:"PMP · Liability-Driven & Index FI",q:"The three conditions to immunise multiple liabilities.",
 items:["Market value of assets ≥ market value of liabilities","Asset basis point value (BPV) equals liability BPV","Dispersion of cash flows and convexity of assets exceed those of the liabilities"]},
{t:"qa",c:"PMP · Liability-Driven & Index FI",q:"How many futures contracts are needed to immunise, and which direction?",
 a:"(Liability BPV − Asset BPV) ÷ Futures BPV. A positive result means buy (go long) futures; negative means sell (go short). Futures BPV ≈ BPV of the cheapest-to-deliver security ÷ its conversion factor."},
{t:"contrast",c:"PMP · Liability-Driven & Index FI",q:"ABO vs PBO as pension liability measures.",
 left:{label:"ABO",points:["Accumulated Benefit Obligation","Based on current wages"]},
 right:{label:"PBO",points:["Projected Benefit Obligation","Based on expected future wages"]},
 note:"For each measure a model extracts effective duration and BPV. Model risk arises from the many assumptions involved."},
{t:"list",c:"PMP · Liability-Driven & Index FI",q:"The three hedging tools for a pension duration gap, and when each is favoured.",
 items:["Receive-fixed interest rate swap — preferred if rates are expected to stay low","Purchased receiver swaption — attractive if rates are expected to rise","Swaption collar (buy receiver, write payer) — favoured if rates are projected to reach a threshold depending on option costs and strike rates"],
 note:"Hedging ratio = % of the duration gap closed with derivatives; 0% is no hedging, 100% is full immunisation. Strategic hedging is active management of that ratio."},
{t:"qa",c:"PMP · Liability-Driven & Index FI",q:"What is contingent immunisation?",
 a:"Adding active management of the surplus (assets minus liabilities) to reduce the overall cost of retiring the liabilities. Any asset class can be used, and the entity may deliberately over-hedge or under-hedge relative to passive immunisation."},
{t:"list",c:"PMP · Liability-Driven & Index FI",q:"The primary risk factors when tracking a bond index.",
 items:["Duration","Convexity","Key rate durations","Portfolio weights by sector, credit quality, maturity, coupon rate and issuer"],
 note:"Matrix pricing estimates fair value of illiquid corporate bonds from comparable securities. Enhanced indexing (buying a subset) introduces tracking risk."},

/* ---------- PMP · Yield curve ---------- */
{t:"list",c:"PMP · Yield Curve Strategies",q:"The primary yield curve risk factors.",
 items:["Level — parallel shifts up or down","Slope — difference between long-maturity and shorter-maturity yields","Shape or curvature — relationship between short, intermediate and long yields"]},
{t:"contrast",c:"PMP · Yield Curve Strategies",q:"Steepener vs flattener construction.",
 left:{label:"Steepener",points:["Long short-dated bonds, short long-dated bonds","Gains from a wider spread between short and long yields"]},
 right:{label:"Flattener",points:["Sell short-term bonds, buy long-term bonds","Gains from a narrowing spread"]},
 note:"Either may be duration neutral, net long or net short duration, depending on the manager's view of how the slope change splits between short and long yields."},
{t:"qa",c:"PMP · Yield Curve Strategies",q:"Compare barbell and bullet portfolios, and describe the butterfly.",
 a:"For a given duration, a barbell (short plus long positions) has greater convexity than a bullet (concentrated in a single maturity). The butterfly combines a long bullet with a short barbell, or vice versa, to capitalise on expected changes in curve shape."},
{t:"list",c:"PMP · Yield Curve Strategies",q:"Ways to earn excess return in a static, upward-sloping curve environment.",
 items:["Buy-and-hold strategy to increase duration","Roll down the yield curve","Use leverage via a carry trade in cash markets"]},
{t:"contrast",c:"PMP · Yield Curve Strategies",q:"Covered vs uncovered interest rate parity.",
 left:{label:"Covered",points:["Uses a forward contract to lock in domestic currency proceeds","No exchange rate uncertainty remains"]},
 right:{label:"Uncovered",points:["Suggests that over time, returns on unhedged foreign currency exposure equal those on a domestic investment","Empirically violated — hence the profitability of carry trades"]},
 note:"Under interest rate parity, the higher-yielding currency trades at a forward discount and the lower-yielding currency at a forward premium."},

/* ---------- PMP · Credit ---------- */
{t:"contrast",c:"PMP · Credit Strategies",q:"Bottom-up vs top-down credit strategies.",
 left:{label:"Bottom-up",points:["Financial ratio analysis","Reduced-form credit models such as the Z-score model","Structural credit models (e.g. Bloomberg DRSK)"]},
 right:{label:"Top-down",points:["Based on macro factors","Groups investment choices by credit rating and industry sector"]}},
{t:"qa",c:"PMP · Credit Strategies",q:"What are the two key components of a bond's credit risk, and how does the credit cycle affect them?",
 a:"POD (probability of default) and LGD (loss given default). Credit spread changes are driven by the credit cycle — the expansion and contraction of credit over the business cycle. High-yield issuers see far greater POD swings than investment-grade, with distressed bond prices approaching the recovery rate."},
{t:"qa",c:"PMP · Credit Strategies",q:"What does credit curve steepening versus flattening signal?",
 a:"Steepening usually indicates low near-term default expectations and higher growth expectations. Flattening or inversion suggests rising default expectations and lower future growth."},
{t:"qa",c:"PMP · Credit Strategies",q:"Why is liquidity risk higher in credit markets than equities, and how is it managed?",
 a:"Because of market structure differences — bilateral, dealer-centric trading. Managed by using liquid bonds for short-term tactical positioning, less liquid positions for buy-and-hold, and liquid alternatives where active management adds little value. Tail risk is quantified with VaR or expected shortfall and managed with position limits, risk budgeting or derivatives."},

{c:"PMP · Active Equity: Portfolio Construction",n:"Jensen's alpha",f:"α = R_p − [R_f + β_p(R_m − R_f)]",d:"CAPM-adjusted outperformance. Links to the fundamental law via E(α) = IC × √BR × σ_A × TC."},
{c:"PMP · Active Equity: Portfolio Construction",n:"Active risk (tracking error)",f:"σ_A = √Var(R_P − R_B)",d:"R_P = portfolio return, R_B = benchmark return, σ_A = standard deviation of active return."},
{c:"PMP · Active Equity: Portfolio Construction",n:"Days-to-trade (capacity)",f:"Days-to-trade = Position$ ÷ (0.10 × ADV$)",d:"Position$ = AUM × target weight; ADV$ = average daily dollar volume. If days-to-trade exceeds the strategy horizon, the fund is capacity-constrained."},
{c:"PMP · Active Equity: Portfolio Construction",n:"Expected active return from information ratio",f:"R_A = IR × TE",d:"IR = information ratio, TE = tracking error (active risk)."},
{c:"PMP · Active Equity: Portfolio Construction",n:"Correlation-adjusted effective breadth",f:"BR_eff = N ÷ [1 + (N−1)ρ]",d:"N = raw number of bets, ρ = average pairwise correlation across signals. Correlated signals collapse effective breadth fast."},
{c:"PMP · Active Equity: Portfolio Construction",n:"Active share of an equity portfolio",f:"AS = ½ Σᴺ |w_p,i − w_b,i|",d:"w_p,i = portfolio weight in stock i, w_b,i = benchmark weight in stock i, N = combined universe."},

/* --- LDI --- */
{c:"PMP · Liability-Driven & Index FI",n:"DV01 (dollar value of an 01)",f:"DV01 = (Modified duration × V) ÷ 10,000",d:"Dollar price change for a 1bp decline in yield. V = portfolio market value."},
{c:"PMP · Liability-Driven & Index FI",n:"DV01 (price value of a basis point) — alternative form",f:"DV01 = D_mod × MV × 0.0001",d:"D_mod = modified duration, MV = market value of the bond or portfolio. Same quantity, different arrangement."},
{c:"PMP · Liability-Driven & Index FI",n:"Futures contracts for duration adjustment",f:"N_f = [(D_target − D_portfolio) × V_portfolio] ÷ (D_futures × V_futures)",d:"D = duration, V = dollar value. Positive N_f → buy futures to extend duration; negative → sell futures to shorten it."},
{c:"PMP · Liability-Driven & Index FI",n:"Liability-driven surplus duration",f:"ΔSurplus = (D_A × A − D_L × L) × Δy",d:"D_A = asset duration, A = asset value, D_L = liability duration, L = liability value. Immunised when D_A × A = D_L × L."},
{c:"PMP · Liability-Driven & Index FI",n:"Macaulay duration of a bond portfolio",f:"D_Mac = Σ t·CF_t/(1+y)^t ÷ Σ CF_t/(1+y)^t",d:"t = time of cash flow, CF_t = cash flow at t, y = yield, N = number of periods."},
{c:"PMP · Liability-Driven & Index FI",n:"Modified duration from Macaulay duration",f:"D_mod = D_Mac ÷ (1 + y)",d:"D_Mac = Macaulay duration, y = periodic yield to maturity."},
{c:"PMP · Liability-Driven & Index FI",n:"Dollar duration of a portfolio or liability",f:"DD = MV × D",d:"MV = market value (or PV of liabilities), D = modified or effective duration. Used to size LDI hedges."},
{c:"PMP · Liability-Driven & Index FI",n:"Insurer duration-matched immunisation",f:"D_A × A = D_L × L",d:"D_A = asset duration, A = assets, D_L = liability duration, L = liabilities."},
{c:"PMP · Liability-Driven & Index FI",n:"DV01-based hedge ratio",f:"N = − DV01_portfolio ÷ DV01_hedge",d:"Negative means short the hedge instrument. For a cross-hedge: N = −(DV01_p ÷ DV01_h) × β_spread."},

/* --- Yield curve --- */
{c:"PMP · Yield Curve Strategies",n:"Key rate duration",f:"%ΔP ≈ − Σ_k KRD_k × Δy_k",d:"KRD_k = key rate duration at maturity k. Used for non-parallel shifts; the sum of KRDs approximates effective duration."},
{c:"PMP · Yield Curve Strategies",n:"Butterfly spread conditions",f:"Profit condition (long butterfly): 2y_5Y < y_2Y + y_10Y",d:"Net position: long the belly, short the wings (or the reverse). A positive butterfly means the curve humps in the middle. Measures curvature."},
{c:"PMP · Yield Curve Strategies",n:"Barbell vs bullet convexity",f:"At the same duration: C_barbell > C_bullet",d:"Barbell (short + long) has higher convexity; bullet (middle) lower. Barbell wins in high volatility, bullet in stable curves."},
{c:"PMP · Yield Curve Strategies",n:"Expected price change from rate view vs forwards",f:"E(ΔP) ≈ −D(Δy_view − Δy_fwd) + ½C(Δy_view)²",d:"D = duration, C = convexity, Δy_view = your view of the yield change, Δy_fwd = the forward-implied change. Only the deviation from forwards earns you anything."},
{c:"PMP · Yield Curve Strategies",n:"Expected bond return from a yield change",f:"E(R) ≈ Y + Rolldown − D_mod·Δy + ½C(Δy)²",d:"Y = yield income, D_mod = modified duration, C = convexity, Δy = yield change."},
{c:"PMP · Yield Curve Strategies",n:"Expected return of a yield curve strategy",f:"E(R) = Y + Rolldown + E(ΔP_view) − E(Credit Loss) ± E(FX)",d:"Y = yield income, ΔP_view = price change from the rate view, FX = currency return."},
{c:"PMP · Yield Curve Strategies",n:"Hedged cross-currency bond return under CIP",f:"R_hedged ≈ R_local − (r_local − r_base)",d:"R_local = local bond return, r_local = local risk-free rate, r_base = base-currency risk-free rate."},

/* --- Credit --- */
{c:"PMP · Credit Strategies",n:"Credit spread duration",f:"%ΔP ≈ − Spread duration × Δs",d:"Δs = change in credit spread. For corporate bonds spread duration ≈ modified duration; for FRNs ≈ time to reset."},
{c:"PMP · Credit Strategies",n:"Excess return over Treasuries",f:"XR ≈ s·t − Δs·D_s − t·p·L",d:"s = spread, t = horizon, D_s = spread duration, p = probability of default, L = loss rate."},
{c:"PMP · Credit Strategies",n:"CDS–cash basis",f:"Basis = CDS spread − Z-spread_cash",d:"CDS spread = single-name or index protection premium (bps); Z-spread_cash = zero-volatility spread on the cash bond (bps)."},
{c:"PMP · Credit Strategies",n:"Option-adjusted spread",f:"OAS = Z-spread − Option cost",d:"Z-spread = zero-volatility spread (bps); option cost = embedded option value from a lattice or Monte Carlo (bps)."},
{c:"PMP · Credit Strategies",n:"Conditional value at risk",f:"CVaR_α = E[L | L > VaR_α]",d:"L = portfolio loss, VaR_α = value at risk at confidence level α, E[·] = expected value conditional on breaching the tail."},
{c:"PMP · Credit Strategies",n:"FX-hedged USD-equivalent OAS on foreign credit",f:"OAS_USD-eq = OAS_foreign − (r_base − r_foreign)",d:"r_base, r_foreign = short rates in base and foreign currency; the differential is the rolling FX-forward hedge cost."},

/* --- Trade execution --- */
{c:"PMP · Trade Strategy & Execution",n:"Implementation shortfall",f:"IS = (Paper portfolio gain − Actual portfolio gain) ÷ Investment decision value",d:"Components: delay cost + trading cost + opportunity cost. Measures total cost of executing versus the decision price."},
{c:"PMP · Trade Strategy & Execution",n:"Implementation shortfall (decomposition)",f:"IS = Explicit + Delay + Impact + Opportunity",d:"Explicit = commissions and fees; delay = decision-to-desk drift; impact = price move from the trade; opportunity = return on unfilled shares."},
{c:"PMP · Trade Strategy & Execution",n:"Delay cost component",f:"Delay = (P_arrival − P_decision) × S_filled",d:"P_arrival = price when the trader receives the order, P_decision = PM decision price, S_filled = shares executed."},
{c:"PMP · Trade Strategy & Execution",n:"Trading cost component",f:"Trading = (P_exec − P_arrival) × S_filled",d:"P_exec = average execution price, P_arrival = arrival price, S_filled = shares filled."},
{c:"PMP · Trade Strategy & Execution",n:"Opportunity cost component",f:"Opportunity = (P_close − P_decision) × S_unfilled",d:"P_close = closing price, P_decision = decision price, S_unfilled = shares not filled."},
{c:"PMP · Trade Strategy & Execution",n:"Explicit fees component",f:"Fees = c × S_exec + taxes",d:"c = commission per share, S_exec = shares executed, taxes = transaction taxes."},
{c:"PMP · Trade Strategy & Execution",n:"VWAP benchmark",f:"VWAP = Σ(P_t × V_t) ÷ Σ V_t",d:"P_t = price at time t, V_t = volume at time t. Trade cost vs VWAP = (VWAP − execution price) for buys. Manipulable, and meaningless for large orders."},
{c:"PMP · Trade Strategy & Execution",n:"VWAP transaction cost (buy and sell)",f:"Buy: P_exec − VWAP   Sell: VWAP − P_exec",d:"Positive is unfavourable in both directions. VWAP = period volume-weighted average price."},
{c:"PMP · Trade Strategy & Execution",n:"Market impact cost",f:"Market impact = (P_exec − P_pre) ÷ P_pre   (for buys)",d:"P_exec = average execution price, P_pre = pre-trade benchmark. Temporary impact reverses, permanent impact does not. Higher urgency means more impact."},
{c:"PMP · Trade Strategy & Execution",n:"Square-root market impact model",f:"Impact ∝ √(shares ÷ ADV)",d:"Shares = order size, ADV = average daily volume. Doubling order size raises impact by roughly 41%, not 100%."},

/* --- Institutional / endowment --- */
{c:"PC · Institutional Investors",n:"Effective spending rate",f:"r_eff = S_t ÷ MV_t",d:"S_t = current period spending distribution, MV_t = current portfolio market value."},
{c:"PC · Institutional Investors",n:"Endowment smoothing spending rule",f:"S_t = w·S_(t−1)(1+π) + (1−w)·r·MV_t",d:"w = smoothing weight, S = spending, π = inflation, r = target rate, MV = current market value."},
{c:"PC · Institutional Investors",n:"Illiquidity budget",f:"IB = TP − (Sp + CC + RB + SR)",d:"TP = total portfolio, Sp = spending reserve, CC = capital calls, RB = rebalancing buffer, SR = stress reserve."},
{c:"PC · Institutional Investors",n:"Endowment spending rate",f:"s = Annual spending ÷ Portfolio value",d:"For example 5% is $40M drawn on an $800M portfolio."},
{c:"PC · Institutional Investors",n:"Endowment real return target",f:"R_real = s + c",d:"s = spending rate, c = management cost ratio."},
{c:"PC · Institutional Investors",n:"Foundation minimum nominal return target",f:"R ≥ 0.05 + c + π",d:"0.05 = the 5% IRS minimum distribution floor, c = costs, π = inflation."},
{c:"PC · Institutional Investors",n:"Pension funded ratio",f:"FR = A ÷ L",d:"A = market value of plan assets, L = present value of liabilities (e.g. the PBO)."},
{c:"PC · Institutional Investors",n:"Pension surplus",f:"S = A − L",d:"A = market value of plan assets, L = present value of liabilities. Surplus optimisation maximises return on S."},
{c:"PC · Institutional Investors",n:"SWF stabilisation sub-fund sizing rule",f:"AUM_stab = f × G × n",d:"f = fiscal dependence on the commodity, G = annual government spending, n = years of shortfall coverage."},
{c:"PC · Institutional Investors",n:"Norway-style SWF fiscal transfer rule",f:"T_annual = r_real × V_fund",d:"r_real = expected real return (around 3%), V_fund = fund market value. Principal is preserved."},
{c:"PC · Institutional Investors",n:"Commodity SWF energy-sector exposure cap",f:"w_energy ≤ w_bench − Δ",d:"w_bench = benchmark energy weight, Δ = transition-risk tilt (e.g. 30%) to offset correlation with inflows."},
{c:"PC · Institutional Investors",n:"SWF maximum single-year withdrawal under charter cap",f:"W_max = c × AUM_3y",d:"c = charter cap (e.g. 5%), AUM_3y = three-year average AUM."},
{c:"PC · Institutional Investors",n:"Liquidity coverage ratio for an alternatives programme",f:"LCR = L ÷ CF_12m",d:"L = liquid assets, CF_12m = next-12-month committed cash outflows (capital calls plus benefits)."},
{c:"PC · Institutional Investors",n:"Stress liquidity coverage ratio",f:"LCR_stress = Accessible liquid assets_stress ÷ Cash demands_stress",d:"Minimum prudent target is at least 2× for illiquid-heavy portfolios."},

/* --- Alternatives exposure --- */
{c:"PC · Alternative Investments",n:"Total PE economic exposure",f:"E_PE = NAV + UC",d:"NAV = net asset value of PE holdings, UC = unfunded capital commitments."},
{c:"PC · Alternative Investments",n:"Effective PE allocation including unfunded commitments",f:"w_PE^eff = (NAV + UC) ÷ (P + UC)",d:"NAV = PE net asset value, UC = unfunded commitments, P = total portfolio value."},
{c:"PC · Alternative Investments",n:"Effective equity beta from a PE allocation",f:"β_eff = w_eq + w_PE × β_PE",d:"w_eq = public equity weight, w_PE = PE weight, β_PE ≈ 1.3 (PE equity beta)."},

/* --- Private wealth --- */
{c:"AA · Real-World Constraints",n:"Required pre-tax nominal return for a private client",f:"r = [(S − I)/V + π] ÷ (1 − t) + f",d:"S = spending need, I = other income, V = portfolio value, π = inflation, t = tax rate, f = advisory fees."},
{c:"AA · Real-World Constraints",n:"Real after-tax return approximation",f:"r_real,at ≈ r_nom − π − t·r_nom",d:"r_nom = nominal return, π = inflation rate, t = tax rate on the nominal gain."},
{c:"AA · Real-World Constraints",n:"Taxable-equivalent yield on a municipal bond",f:"TEY = y_muni ÷ (1 − t)",d:"y_muni = muni pretax yield, t = the investor's marginal tax rate."},
{c:"AA · Real-World Constraints",n:"Human capital as present value of future labour income",f:"HC = Σᴺ E[w_t] ÷ (1+r)^t",d:"w_t = expected labour income in year t, r = risk-adjusted discount rate, N = remaining working years."},
{c:"AA · Real-World Constraints",n:"Economic net worth",f:"ENW = FC + PV(HC) − PV(L) − PV(C)",d:"FC = financial capital, PV(HC) = PV of human capital, PV(L) = PV of liabilities, PV(C) = PV of future consumption needs."},
{c:"AA · Real-World Constraints",n:"Leveraged portfolio return on equity",f:"r_p = r_i + (V_B ÷ V_E)(r_i − r_B)",d:"r_i = asset return, r_B = borrowing cost, V_B = borrowed value, V_E = equity."},

/* --- Asset allocation core --- */
{c:"AA · Overview & Principles",n:"Mean–variance optimal portfolio weight",f:"w* = (1/λ) Σ⁻¹ (μ − r_f·1)",d:"λ = risk aversion, Σ = covariance matrix, μ = expected returns."},
{c:"AA · Overview & Principles",n:"Mean–variance utility function",f:"U = E(R_p) − 0.5 · λ · σ_p²",d:"E(R_p) = expected portfolio return, λ = risk aversion coefficient (1–10), σ_p² = portfolio variance."},
{c:"AA · Overview & Principles",n:"Corner portfolio blending",f:"w_A = [E(R_P) − E(R_B)] ÷ [E(R_A) − E(R_B)],  w_B = 1 − w_A",d:"Blends two adjacent corner portfolios A and B to hit a target return E(R_P). All blends lie on the efficient frontier."},
{c:"AA · Overview & Principles",n:"Black–Litterman expected return",f:"Equilibrium: Π = δΣw_mkt\nBlended: E(R) = [(τΣ)⁻¹ + PᵀΩ⁻¹P]⁻¹[(τΣ)⁻¹Π + PᵀΩ⁻¹Q]",d:"δ = risk aversion, w_mkt = market cap weights, P and Q encode the investor's views, Ω their uncertainty."},
{c:"AA · Overview & Principles",n:"Portfolio rebalancing trigger (range-based)",f:"Rebalance when |w_i − w_i*| > Δ_i",d:"w_i* = target weight, Δ_i = tolerance band. Wider bands mean lower costs and less precision; correlation-adjusted bands are wider for high-correlation assets."},
{c:"AA · Overview & Principles",n:"Number of correlation inputs required for MVO",f:"N_ρ = n(n−1) ÷ 2",d:"n = number of asset classes. MVO also needs n expected returns and n standard deviations."},
{c:"AA · Overview & Principles",n:"Total MVO inputs required for n asset classes",f:"N = 2n + n(n−1)/2",d:"Counts n expected returns, n standard deviations and n(n−1)/2 correlations."},
{c:"AA · Overview & Principles",n:"Roy's safety-first ratio",f:"SF = [E(R_p) − R_L] ÷ σ_p",d:"R_L = the minimum acceptable (threshold) return. The optimal portfolio maximises SF; under normality this minimises the probability of returning below R_L."},
{c:"AA · Overview & Principles",n:"Marginal contribution to risk (MCTR)",f:"MCTR_i = β_i × σ_p,  where β_i = Cov(R_i, R_p) ÷ σ_p²",d:"Measures the risk added by a small increase in asset i's weight."},
{c:"AA · Overview & Principles",n:"Absolute contribution to risk (ACTR)",f:"ACTR_i = w_i × MCTR_i = w_i × β_i × σ_p",d:"Contributions sum to total portfolio risk: Σ ACTR_i = σ_p. A risk budget is a set of target ACTRs."},
{c:"AA · Real-World Constraints",n:"TAA permitted weight range around SAA",f:"w_TAA ∈ [w_SAA − b, w_SAA + b]",d:"w_SAA = policy weight, b = the IPS-defined TAA band (e.g. ±5%)."},
{c:"AA · Real-World Constraints",n:"Net after-cost tactical premium",f:"α_net = α_gross − TC − T",d:"α_gross = expected gross tactical alpha, TC = transaction costs, T = realised tax cost."},

/* --- Forecasting returns --- */
{c:"AA · Forecasting Returns",n:"Grinold–Kroner expected equity return",f:"E(R) = D/P − ΔS + g + Δ(P/E)",d:"D/P = dividend yield, ΔS = net share issuance, g = nominal earnings growth, Δ(P/E) = repricing."},
{c:"AA · Forecasting Returns",n:"Taylor rule policy rate",f:"i_t = r* + π_t + 0.5(π_t − π*) + 0.5(y_t − y*)",d:"r* = neutral real rate, π = inflation, π* = inflation target, y − y* = output gap."},
{c:"AA · Forecasting Returns",n:"Covered interest rate parity",f:"F/S = (1 + i_d) ÷ (1 + i_f)",d:"F = forward rate, S = spot rate, i_d = domestic interest rate, i_f = foreign interest rate."},
{c:"AA · Forecasting Returns",n:"Fixed-income expected return building blocks",f:"E(R) = r_f + π^e + TP + CP + LP",d:"r_f = real risk-free rate, π^e = expected inflation, TP = term premium, CP = credit premium, LP = liquidity premium."},
{c:"AA · Forecasting Returns",n:"Expected fixed-income return decomposition",f:"E(R_FI) = YTM + Roll-down + ΔP_yield − L_credit − L_FX",d:"YTM = yield to maturity, ΔP = price change from a curve shift, L = expected losses."},
{c:"AA · Forecasting Returns",n:"GARCH(1,1) variance forecast",f:"σ_t² = ω + α·ε_(t−1)² + β·σ_(t−1)²",d:"ω = long-run volatility anchor, α = weight on the last squared shock, β = weight on the prior variance estimate."},
{c:"AA · Forecasting Returns",n:"Singer–Terhaar blended risk premium",f:"RP = w(σ·ρ·SR_g) + (1 − w)(σ·SR_g)",d:"w = integration weight, σ = asset volatility, ρ = correlation with the global portfolio, SR_g = global Sharpe ratio."},
{c:"AA · Forecasting Returns",n:"Geometric mean approximation from arithmetic mean and variance",f:"G ≈ A − 0.5σ²",d:"G = geometric (compound) mean return, A = arithmetic mean return, σ² = variance of returns."},

/* --- Performance evaluation --- */
{c:"PM · Performance Evaluation",n:"Information ratio",f:"IR = (R̄_p − R̄_B) ÷ σ(R_p − R_B) = ᾱ ÷ TE",d:"ᾱ = mean active return, TE = tracking error. Measures active return per unit of active risk."},
{c:"PM · Performance Evaluation",n:"Fundamental law of active management",f:"IR = IC × √BR",d:"IC = information coefficient, BR = investment breadth. Expected active return E(R_A) = IC × √BR × σ_A, with the transfer coefficient assumed to be 1."},
{c:"PM · Performance Evaluation",n:"Sharpe ratio",f:"SR_p = (R_p − R_f) ÷ σ_p",d:"Reward-to-variability using total risk. Sharpe of a combined portfolio: SR_C² = SR_B² + IR²."},
{c:"PM · Performance Evaluation",n:"M-squared (M²)",f:"M² = (R_p − R_f)(σ_m ÷ σ_p) + R_f",d:"Risk-adjusted return scaled to match the market's volatility. M² > R_m means the portfolio outperformed on a risk-adjusted basis."},
{c:"PM · Performance Evaluation",n:"Treynor ratio",f:"T = (R_p − R_f) ÷ β_p",d:"R_p = portfolio return, R_f = risk-free rate, β_p = portfolio beta (systematic risk only)."},
{c:"PM · Performance Evaluation",n:"Sortino ratio",f:"Sortino = (R_p − MAR) ÷ σ_d",d:"MAR = minimum acceptable return, σ_d = downside deviation of returns falling below the MAR."},
{c:"PM · Performance Evaluation",n:"Tracking error (from a return series)",f:"TE = σ(R_p − R_B) = √[Σ(r_p,t − r_B,t − ᾱ)² ÷ (T−1)]",d:"Also called active risk or tracking risk. Annualise with TE_annual = TE_monthly × √12."},
{c:"PM · Performance Evaluation",n:"Brinson allocation effect",f:"A_i = (w_p,i − w_b,i)(R_b,i − R_b)",d:"w_p = portfolio sector weight, w_b = benchmark sector weight, R_b,i = sector benchmark return, R_b = total benchmark return."},
{c:"PM · Performance Evaluation",n:"Brinson selection effect",f:"S_i = w_b,i (R_p,i − R_b,i)",d:"w_b = benchmark sector weight, R_p,i = portfolio sector return, R_b,i = benchmark sector return."},
{c:"PM · Performance Evaluation",n:"Downside capture ratio",f:"DC = R̄_p,down ÷ R̄_b,down",d:"Averaged over periods when the benchmark return is negative. Below 100% means the manager dampens losses."},
{c:"PM · Performance Evaluation",n:"Upside capture ratio",f:"UC = R̄_p,up ÷ R̄_b,up",d:"Averaged over periods when the benchmark return is positive. Above 100% means the manager amplifies up markets."},
{c:"PM · Performance Evaluation",n:"Up/down capture ratio",f:"Up/Down = Upside Capture ÷ Downside Capture",d:"A ratio above 1.0 indicates favourable asymmetry."},
{c:"PM · Investment Manager Selection",n:"Symmetric performance-based fee",f:"Fee = Base + s × (R_p − R_b)",d:"Base = base fee, s = sharing rate, R_p = portfolio return, R_b = benchmark return."},

/* --- Options --- */
{c:"DRV · Options Strategies",n:"Delta of call and put",f:"Call: Δ_c = N(d₁) ∈ (0, 1)\nPut: Δ_p = N(d₁) − 1 ∈ (−1, 0)\nPut-call: Δ_c − Δ_p = 1",d:"Approximate change in the option price for a $1 change in the underlying."},
{c:"DRV · Options Strategies",n:"Protective put payoff",f:"Payoff = S_T + max(X − S_T, 0) = max(S_T, X)",d:"Profit = Payoff − (S_0 + p), where p = put premium. Limits downside while preserving upside."},
{c:"DRV · Options Strategies",n:"Covered call payoff at expiration",f:"Payoff = S_T − max(S_T − X, 0) = min(S_T, X)",d:"Long stock plus short call at strike X. Profit = Payoff − S_0 + c, where c = call premium received. Caps upside, enhances income in flat or down markets."},
{c:"DRV · Options Strategies",n:"Collar payoff at expiration",f:"Payoff = S_T + max(X_L − S_T, 0) − max(S_T − X_H, 0) = min(max(S_T, X_L), X_H)",d:"Long stock, long put at X_L, short call at X_H. Limits gains above X_H and protects below X_L."},
{c:"DRV · Options Strategies",n:"Long straddle breakeven prices",f:"BE = K ± (C_0 + P_0)",d:"K = common strike, C_0 = call premium paid, P_0 = put premium paid."},
{c:"DRV · Options Strategies",n:"Maximum loss on short stock plus long call",f:"Max Loss = K − S_0 + C_0",d:"The synthetic long put. K = call strike, S_0 = short entry price, C_0 = call premium paid."},
{c:"DRV · Options Strategies",n:"Put–call parity",f:"S + P = C + PV(K)",d:"S = stock price, P = put premium, C = call premium, K = strike, PV(K) = present value of the strike."},

/* --- Futures / swaps --- */
{c:"DRV · Swaps, Forwards & Futures",n:"Number of bond futures to adjust portfolio duration",f:"N = (DD_T − DD_P) ÷ DD_f",d:"DD_T = target dollar duration, DD_P = current dollar duration, DD_f = dollar duration per futures contract (BPV adjusted by the conversion factor)."},
{c:"DRV · Swaps, Forwards & Futures",n:"Number of equity futures to adjust portfolio beta",f:"N = [(β_T − β_P) ÷ β_F] × [V ÷ (P_f × m)]",d:"β_T = target beta, β_P = current beta, β_F = futures beta, V = portfolio value, P_f = futures price, m = multiplier."},
{c:"DRV · Swaps, Forwards & Futures",n:"Variance swap payoff at maturity",f:"Payoff = N_var × (σ_realized² − σ_strike²)",d:"N_var = variance notional, σ_realized = realised volatility (%), σ_strike = strike volatility (%)."},
{c:"DRV · Swaps, Forwards & Futures",n:"Variance notional converted from vega notional",f:"N_var = N_vega ÷ (2 × σ_strike)",d:"N_vega = vega notional ($ per vol point), σ_strike = strike volatility in whole-number percent."},

/* --- Currency --- */
{c:"DRV · Currency Management",n:"Roll yield on a currency forward hedge",f:"Roll yield = (F − S) ÷ S",d:"F = forward rate, S = spot rate. Approximately equals the domestic minus foreign interest rate."},
{c:"DRV · Currency Management",n:"Minimum-variance hedge ratio (MVHR)",f:"h* = ρ_A,B × (σ_A ÷ σ_B)",d:"A = asset hedged, B = hedging instrument, ρ = correlation, σ = volatility."},
{c:"DRV · Currency Management",n:"Domestic-currency return on a foreign asset",f:"R_DC = (1 + R_FC)(1 + R_FX) − 1",d:"R_FC = foreign asset return, R_FX = % change in the exchange rate (domestic per foreign). The shortcut R_FC + R_FX drops the cross-product, which matters once either exceeds 5–10%."},
];
