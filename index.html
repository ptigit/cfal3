let deckMode='all';           // 'all' | 'concepts' | 'formulas'
let refFilter='';
let sprint=[], sprintPos=0, revealed=0, sprintLog=[];
const isFormula=i=>CARDS[i].t==='formula';
function inMode(i){
  if(deckMode==='concepts') return !isFormula(i);
  if(deckMode==='formulas') return isFormula(i);
  return true;
}
const app=document.getElementById('app');
const CATS=[...new Set(CARDS.map(c=>c.c))];

/* ---- storage adapter: artifact store → device store → memory ---- */
let MODE='memory';   // 'cloud' | 'device' | 'memory'
const MODE_LABEL={
  cloud:'Syncing to your Claude account',
  device:'Saving on this device only',
  memory:'Not saving — progress lost on close'
};

function hydrate(raw){
  if(!raw) return false;
  try{const p=JSON.parse(raw);
    store={seen:p.seen||{},hits:p.hits||{},misses:p.misses||{}};
    return true;
  }catch(e){return false;}
}

async function probeCloud(){
  if(typeof window.storage==='undefined'||!window.storage) return false;
  try{
    // a real round-trip is the only reliable test
    const probe='__probe_'+Date.now();
    const w=await window.storage.set(probe,'1',false);
    if(!w||typeof w!=='object') return false;
    try{await window.storage.delete(probe,false);}catch(e){}
    return true;
  }catch(e){return false;}
}
function probeDevice(){
  try{
    localStorage.setItem('__probe','1');
    localStorage.removeItem('__probe');
    return true;
  }catch(e){return false;}
}

async function load(){
  if(await probeCloud()){
    MODE='cloud';
    try{const r=await window.storage.get(KEY,false); if(r&&r.value) hydrate(r.value);}catch(e){}
    return;
  }
  if(probeDevice()){
    MODE='device';
    hydrate(localStorage.getItem(KEY));
    return;
  }
  MODE='memory';
}

async function save(){
  const payload=JSON.stringify(store);
  if(MODE==='cloud'){
    try{
      const r=await window.storage.set(KEY,payload,false);
      if(r&&typeof r==='object') return;
      throw new Error('bad response');
    }catch(e){
      // cloud died mid-session — drop down a tier rather than lose the session
      MODE=probeDevice()?'device':'memory';
    }
  }
  if(MODE==='device'){
    try{localStorage.setItem(KEY,payload);}catch(e){MODE='memory';}
  }
}

/* card strength: 0 (never seen / always missed) .. 1 (reliably known) */
function strength(i){
  const h=store.hits[i]||0, m=store.misses[i]||0;
  if(h+m===0) return 0;
  return h/(h+m);
}
function catStats(cat){
  const idx=CARDS.map((c,i)=>[c,i]).filter(([c],i)=>c.c===cat).map(([,i])=>i).filter(inMode);
  const seen=idx.filter(i=>store.seen[i]).length;
  const score=idx.length?idx.reduce((s,i)=>s+strength(i),0)/idx.length:0;
  return {idx,total:idx.length,seen,score};
}
function activeCats(){
  return CATS.filter(c=>catStats(c).total>0);
}
function totals(){
  const all=CARDS.map((_,i)=>i).filter(inMode);
  return {
    total:all.length,
    seen:all.filter(i=>store.seen[i]).length,
    solid:all.filter(i=>strength(i)>=0.67&&store.seen[i]).length,
    shaky:all.filter(i=>store.seen[i]&&strength(i)<0.67).length
  };
}

/* weakest-topic-first selection */
function buildSprint(forcedCat){
  let cat=forcedCat;
  if(!cat){
    // rank categories: unseen coverage first, then low strength
    const ranked=activeCats().map(c=>{
      const s=catStats(c);
      const coverage=s.seen/s.total;
      return {c, key: s.score*0.65 + coverage*0.35};
    }).sort((a,b)=>a.key-b.key);
    cat=ranked[0].c;
  }
  const s=catStats(cat);
  // within the category: unseen first, then weakest, then least recently correct
  const pool=[...s.idx].sort((a,b)=>{
    const sa=store.seen[a]?1:0, sb=store.seen[b]?1:0;
    if(sa!==sb) return sa-sb;
    return strength(a)-strength(b);
  });
  let picked=pool.slice(0,SPRINT_SIZE);
  if(picked.length<SPRINT_SIZE){
    const rest=CARDS.map((_,i)=>i).filter(inMode).filter(i=>!picked.includes(i))
      .sort((a,b)=>strength(a)-strength(b));
    picked=picked.concat(rest.slice(0,SPRINT_SIZE-picked.length));
  }
  sprint=picked; sprintPos=0; revealed=0; sprintLog=[];
  view='sprint'; render();
}

function grade(ok){
  const i=sprint[sprintPos];
  store.seen[i]=true;
  if(ok) store.hits[i]=(store.hits[i]||0)+1;
  else   store.misses[i]=(store.misses[i]||0)+1;
  sprintLog.push({i,ok});
  save();
  if(sprintPos<sprint.length-1){sprintPos++;revealed=0;}
  else{view='done';}
  render();
}

/* ============================================================
   RENDER
   ============================================================ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function renderHome(){
  const t=totals();
  const ranked=activeCats().map(c=>({c,...catStats(c)}))
    .sort((a,b)=>(a.score*0.65+(a.seen/a.total)*0.35)-(b.score*0.65+(b.seen/b.total)*0.35));
  const weakest=ranked[0];
  const nF=CARDS.filter(c=>c.t==='formula').length;

  app.innerHTML=`
  <div class="topbar">
    <div><h1>CFA L3 Sprints</h1><div class="sub">${CARDS.length} cards · ${nF} formulas · ${CATS.length} topics</div></div>
  </div>

  <div class="modebar">
    <button class="mode ${deckMode==='all'?'on':''}" data-m="all">Everything</button>
    <button class="mode ${deckMode==='concepts'?'on':''}" data-m="concepts">Concepts</button>
    <button class="mode ${deckMode==='formulas'?'on':''}" data-m="formulas">Formulas</button>
  </div>

  <div class="hero">
    <div class="eyebrow">Next up · weakest topic</div>
    <h2>${esc(weakest.c)}</h2>
    <p>${weakest.seen}/${weakest.total} cards attempted${weakest.seen?` · ${Math.round(weakest.score*100)}% recall`:''}. Five cards, about 90 seconds.</p>
    <button class="big-btn" id="go">Start sprint →</button>
    <button class="big-btn secondary" id="goRandom">Sprint a random topic</button>
    <button class="big-btn secondary" id="goRef">📖 Formula reference</button>
  </div>

  <div class="stat-row">
    <div class="stat tot"><b>${t.seen}</b><span>Attempted</span></div>
    <div class="stat ok"><b>${t.solid}</b><span>Solid</span></div>
    <div class="stat warn"><b>${t.shaky}</b><span>Shaky</span></div>
  </div>

  <div class="section-label">Topic strength — weakest first</div>
  <div id="topics">
  ${ranked.map(r=>{
    const pct=r.seen?Math.round(r.score*100):null;
    const cls=pct===null?'weak':(pct>=75?'':(pct>=50?'mid':'weak'));
    const w=pct===null?0:pct;
    return `<div class="topic" data-cat="${esc(r.c)}">
      <div class="topic-head">
        <span class="topic-name">${esc(r.c)}</span>
        <span class="topic-pct">${pct===null?'not started':pct+'%'} · ${r.seen}/${r.total}</span>
      </div>
      <div class="bar ${cls}"><i style="width:${w}%"></i></div>
    </div>`;}).join('')}
  </div>
  <div class="muted-note">
    <span style="color:${MODE==='memory'?'#ff6b6b':(MODE==='device'?'#ffb454':'#3ddc97')}">●</span>
    ${MODE_LABEL[MODE]}. Cards you miss resurface sooner.
  </div>
  <div style="height:24px"></div>`;

  document.getElementById('go').onclick=()=>buildSprint(weakest.c);
  document.getElementById('goRandom').onclick=()=>{
    const a=activeCats(); buildSprint(a[Math.floor(Math.random()*a.length)]);
  };
  document.getElementById('goRef').onclick=()=>{view='ref';refFilter='';render();};
  document.querySelectorAll('.mode').forEach(b=>{
    b.onclick=()=>{deckMode=b.dataset.m;render();};
  });
  document.querySelectorAll('.topic').forEach(el=>{
    el.onclick=()=>buildSprint(el.dataset.cat);
  });
}

function renderSprint(){
  const card=CARDS[sprint[sprintPos]];
  const dots=sprint.map((_,k)=>`<div class="dot ${k<sprintPos?'done':(k===sprintPos?'active':'')}"></div>`).join('');
  let body='', controls='';

  if(card.t==='qa'){
    body=`<div class="panel">
      <div class="cat-tag">${esc(card.c)}</div>
      <p class="prompt">${esc(card.q)}</p>
      ${revealed?`<div class="answer">${esc(card.a)}</div>`:`<div class="tap-hint">recall it, then reveal</div>`}
    </div>`;
    controls=revealed?gradeRow():`<button class="reveal-btn" id="rev">Reveal answer</button>`;
  }

  if(card.t==='list'){
    const n=card.items.length;
    body=`<div class="panel">
      <div class="cat-tag">${esc(card.c)}</div>
      <p class="prompt small">${esc(card.q)}</p>
      <div class="list-meta">${revealed} of ${n} revealed — how many did you get?</div>
      ${card.items.map((it,k)=>`
        <div class="slot ${k<revealed?'open':''}">
          <div class="slot-num">${k+1}</div>
          <div class="slot-text ${k<revealed?'':'hidden'}">${k<revealed?esc(it):'—'}</div>
        </div>`).join('')}
      ${revealed>=n&&card.note?`<div class="answer">${esc(card.note)}</div>`:''}
    </div>`;
    controls = revealed<n
      ? `<button class="reveal-btn" id="rev">Reveal next (${revealed+1}/${n})</button>`
      : gradeRow();
  }

  if(card.t==='formula'){
    body=`<div class="panel">
      <div class="cat-tag">${esc(card.c)}</div>
      <div class="f-ask">State the formula</div>
      <p class="prompt small">${esc(card.q)}</p>
      ${revealed?`<div class="f-box">${esc(card.f)}</div>
                  <div class="answer">${esc(card.d)}</div>`
                :`<div class="tap-hint">write it out, then reveal</div>`}
    </div>`;
    controls=revealed?gradeRow():`<button class="reveal-btn" id="rev">Reveal formula</button>`;
  }

  if(card.t==='contrast'){
    const L=revealed>=1, R=revealed>=2;
    body=`<div class="panel">
      <div class="cat-tag">${esc(card.c)}</div>
      <p class="prompt small">${esc(card.q)}</p>
      <div class="col" id="colL">
        <div class="col-label">${esc(card.left.label)}</div>
        ${L?`<ul>${card.left.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`
           :`<div class="col-tap">tap to reveal</div>`}
      </div>
      <div class="col" id="colR">
        <div class="col-label">${esc(card.right.label)}</div>
        ${R?`<ul>${card.right.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`
           :`<div class="col-tap">tap to reveal</div>`}
      </div>
      ${L&&R&&card.note?`<div class="answer">${esc(card.note)}</div>`:''}
    </div>`;
    controls = (L&&R) ? gradeRow() : `<div class="tap-hint">reveal each side once you've recalled it</div>`;
  }

  app.innerHTML=`
  <div class="sprint-head">
    <div class="dots">${dots}</div>
    <button class="close-x" id="quit">✕</button>
  </div>
  <div class="card-area">${body}${controls}</div>`;

  document.getElementById('quit').onclick=()=>{view='home';render();};
  const rev=document.getElementById('rev');
  if(rev) rev.onclick=()=>{revealed++;render();};
  const cl=document.getElementById('colL'), cr=document.getElementById('colR');
  if(cl) cl.onclick=()=>{if(revealed<1){revealed=1;render();}};
  if(cr) cr.onclick=()=>{if(revealed<2){revealed=revealed<1?1:2;render();}};
  const gm=document.getElementById('gMiss'), gg=document.getElementById('gGot');
  if(gm) gm.onclick=()=>grade(false);
  if(gg) gg.onclick=()=>grade(true);
}
function gradeRow(){
  return `<div class="grade-row">
    <button class="grade miss" id="gMiss">Didn't have it</button>
    <button class="grade got" id="gGot">Had it</button>
  </div>`;
}

function renderDone(){
  const got=sprintLog.filter(x=>x.ok).length;
  const t=totals();
  app.innerHTML=`
  <div class="done-wrap">
    <div class="done-mark">${got===SPRINT_SIZE?'🎯':(got>=3?'👍':'📌')}</div>
    <h2>${got} of ${sprintLog.length}</h2>
    <p>${got===sprintLog.length?'Clean sweep. That topic is holding.':
        got>=3?'Solid session. The misses will come back around sooner.':
        'Worth another pass at this topic shortly.'}</p>
    <div class="recap">
      ${sprintLog.map(x=>`<div class="recap-item">${x.ok?'✓':'✗'} <b>${esc(CARDS[x.i].q.slice(0,74))}${CARDS[x.i].q.length>74?'…':''}</b></div>`).join('')}
    </div>
    <button class="big-btn" id="again" style="margin-top:18px">Another sprint →</button>
    <button class="big-btn secondary" id="home">Back to topics</button>
    <div class="muted-note">${t.seen}/${t.total} cards attempted overall</div>
  </div>`;
  document.getElementById('again').onclick=()=>buildSprint();
  document.getElementById('home').onclick=()=>{view='home';render();};
}

function renderRef(){
  const q=refFilter.trim().toLowerCase();
  const rows=CARDS.map((c,i)=>({c,i})).filter(x=>x.c.t==='formula')
    .filter(x=>!q||(x.c.q+' '+x.c.f+' '+x.c.d+' '+x.c.c).toLowerCase().includes(q));
  const byCat={};
  rows.forEach(x=>{(byCat[x.c.c]=byCat[x.c.c]||[]).push(x);});
  app.innerHTML=`
  <div class="topbar">
    <div><h1>Formula reference</h1><div class="sub">${rows.length} shown · look up, don't drill</div></div>
    <button class="icon-btn" id="back">Done</button>
  </div>
  <input class="search" id="q" placeholder="Search formulas, terms, topics…" value="${esc(refFilter)}">
  <div id="reflist">
    ${Object.keys(byCat).map(cat=>`
      <div class="section-label">${esc(cat)}</div>
      ${byCat[cat].map(x=>`
        <div class="ref-card">
          <div class="ref-name">${esc(x.c.q)}</div>
          <div class="f-box">${esc(x.c.f)}</div>
          <div class="ref-d">${esc(x.c.d)}</div>
        </div>`).join('')}
    `).join('')}
    ${rows.length===0?'<div class="empty-state">Nothing matches that.</div>':''}
  </div>
  <div style="height:30px"></div>`;
  document.getElementById('back').onclick=()=>{view='home';render();};
  const inp=document.getElementById('q');
  inp.oninput=()=>{
    refFilter=inp.value;
    const pos=inp.selectionStart;
    renderRef();
    const ni=document.getElementById('q');
    ni.focus(); ni.setSelectionRange(pos,pos);
  };
}

function render(){
  if(view==='home') renderHome();
  else if(view==='sprint') renderSprint();
  else if(view==='ref') renderRef();
  else renderDone();
  if(view!=='ref') window.scrollTo(0,0);
}

(async function init(){ await load(); render(); })();
</script>
</body>
</html>
